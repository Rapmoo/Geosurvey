server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The service worker's own update-detection relies on the browser
    # re-fetching sw.js instead of serving a stale cached copy (see
    # PWA_SETUP.md's "Updates" section) — never let a proxy/CDN cache
    # this file. Same reasoning applies to the manifest.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Everything else in the app shell is fine to cache briefly.
    location ~* \.(?:css|js|png|jpg|jpeg|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
